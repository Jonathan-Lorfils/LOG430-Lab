services:
  app-migrator:
    build: .
    command: node src/migrate.js
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://myuser:mypassword@db:5432/postgres
    networks:
      - monitoring

  app1:
    build: .
    container_name: pos-app1
    stdin_open: true
    tty: true
    depends_on:
      app-migrator:
        condition: service_completed_successfully
    environment:
      - INSTANCE_ID=app1
      - DATABASE_URL=postgres://myuser:mypassword@db:5432/postgres
    working_dir: /app
    command: node src/server.js
    volumes:
      - .:/app
    expose:
      - "3000"
    networks:
      - monitoring

  app2:
    build: .
    container_name: pos-app2
    stdin_open: true
    tty: true
    depends_on:
      app-migrator:
        condition: service_completed_successfully
    environment:
      - INSTANCE_ID=app2
      - DATABASE_URL=postgres://myuser:mypassword@db:5432/postgres
    working_dir: /app
    command: node src/server.js
    volumes:
      - .:/app
    expose:
      - "3000"
    networks:
      - monitoring

  nginx:
    image: nginx:latest
    container_name: nginx-lb
    depends_on:
      - app1
      - app2
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "3000:80"
    networks:
      - monitoring

  db:
    image: postgres:17
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: postgres
    ports:
      - "5432"
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3001:3000"
    networks:
      - monitoring
    volumes:
      - grafana-storage:/var/lib/grafana

networks:
  monitoring:


volumes:
  grafana-storage:
