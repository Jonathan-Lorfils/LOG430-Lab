events {}

http {
  resolver 127.0.0.11 valid=10s;

  upstream cart-service {
    server cart-service:3000;
    server cart-service-2:3000;
  }

  server {
    listen 80;

    # Route pour cart-service avec load balancing
    location ~ ^/api/v1/cart(/|$)(.*) {

      # Gérer CORS pour cart-service
      if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Length' 0;
        add_header 'Content-Type' 'text/plain charset=UTF-8';
        return 204;
      }

      add_header 'Access-Control-Allow-Origin' '*';
      add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
      add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';

      proxy_pass http://cart-service;

      proxy_set_header X-API-GATEWAY "POS-Gateway";
      proxy_set_header Authorization $http_authorization;

      access_log /var/log/nginx/access.log;
      error_log /var/log/nginx/error.log;
    }

    # Routes pour les autres services
    location ~ ^/api/v1/([^/]+)(/|$)(.*) {
      set $service $1;

      # Si le service est cart, il est déjà géré ci-dessus
      if ($service = "cart") {
        return 404;
      }

      # Gérer CORS pour les autres services
      if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Length' 0;
        add_header 'Content-Type' 'text/plain charset=UTF-8';
        return 204;
      }

      add_header 'Access-Control-Allow-Origin' '*';
      add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
      add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';

      proxy_pass http://$service-service:3000;

      proxy_set_header X-API-GATEWAY "POS-Gateway";
      proxy_set_header Authorization $http_authorization;

      access_log /var/log/nginx/access.log;
      error_log /var/log/nginx/error.log;
    }
  }
}
