events {}

http {
  server {
    listen 80;

    location /api/v1/products/ {
      proxy_pass http://product-service:3000/;
    }

    location /api/v1/sales/ {
      proxy_pass http://sales-service:3000/;
    }

    location /api/v1/inventory/ {
      proxy_pass http://inventory-service:3000/;
    }

    location /api/v1/customers/ {
      proxy_pass http://customer-service:3000/;
    }

    location /api/v1/carts/ {
      proxy_pass http://cart-service:3000/;
    }

    location /api/v1/orders/ {
      proxy_pass http://checkout-service:3000/;
    }

    # En-têtes ajoutés par l’API Gateway
    proxy_set_header X-API-GATEWAY "POS-Gateway";
    proxy_set_header Authorization $http_authorization;

    # Logs (si nécessaire)
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
  }
}
